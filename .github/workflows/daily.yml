
name: Daily AshisAura Short

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: read

concurrency:
  group: daily-ashisaura
  cancel-in-progress: false

jobs:
  create-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Restore YouTube OAuth files
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          import json

          files = {
              "YOUTUBE_CLIENT_SECRET_JSON": "client_secret.json",
              "YOUTUBE_TOKEN_JSON": "token.json",
          }

          for secret_name, filename in files.items():
              value = os.environ.get(secret_name, "")
              if not value:
                  raise SystemExit(f"Missing GitHub Secret: {secret_name}")

              try:
                  data = json.loads(value)
              except json.JSONDecodeError:
                  raise SystemExit(f"{secret_name} is not valid JSON")

              with open(filename, "w", encoding="utf-8") as f:
                  json.dump(data, f)

              print(f"{filename} restored successfully")
          PY

      - name: Generate, SEO and schedule upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUBLISH_HOUR_IST: "19"
          PUBLISH_MINUTE_IST: "0"
          TTS_VOICE: "en-US-GuyNeural"
        run: python main.py
