
      - name: Restore YouTube OAuth files
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          import json

          files = {
              "YOUTUBE_CLIENT_SECRET_JSON": "client_secret.json",
              "YOUTUBE_TOKEN_JSON": "token.json",
          }

          for secret_name, filename in files.items():
              value = os.environ.get(secret_name, "")
              if not value:
                  raise SystemExit(f"Missing GitHub Secret: {secret_name}")

              try:
                  data = json.loads(value)
              except json.JSONDecodeError:
                  raise SystemExit(f"{secret_name} is not valid JSON")

              with open(filename, "w", encoding="utf-8") as f:
                  json.dump(data, f)
              
              print(f"{filename} restored successfully")
          PY
